name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.4'

      - name: Install dependencies
        run: npm install
        working-directory: ./blog-Mobile

      - name: Run ESLint
        run: npx eslint .
        working-directory: ./blog-Mobile

      - name: Run expo-check
        run: npx expo install --check
        working-directory: ./blog-Mobile

      - name: run expo-doctor
        run: npx expo-doctor
        working-directory: ./blog-Mobile